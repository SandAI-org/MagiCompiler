name: Integration Test on PR

on:
    pull_request_target:
        types: [labeled]
        branches:
        -   main

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-run-test
    cancel-in-progress: true

jobs:
    guard:
        name: Check ci:run label
        runs-on: ubuntu-latest
        permissions:
            pull-requests: write
        steps:
        -   name: Require ci:run label
            run: |
                if [ "${{ github.event.label.name }}" != "ci:run" ]; then
                  echo "::notice::Skipped: label is not ci:run."
                  exit 1
                fi
        -   name: Remove ci:run label
            uses: actions/github-script@v7
            with:
                script: |
                    await github.rest.issues.removeLabel({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: context.issue.number,
                        name: 'ci:run'
                    });

    pt29:
        name: PyTorch 2.9
        needs: guard
        uses: ./.github/workflows/_ci_pipeline.yml
        with:
            kind: pr
            workspace: /home/niubility2/cenzhiyao/ci/magi-compiler-workspaces/pr-${{ github.event.pull_request.number }}-pt29
            head-sha: ${{ github.event.pull_request.head.sha }}
            base-sha: ${{ github.event.pull_request.base.sha }}
            pr-number: ${{ github.event.pull_request.number }}
            base-image: nvcr.io/nvidia/pytorch:25.10-py3
            pytorch-label: pt29
        secrets: inherit

    pt212:
        name: PyTorch 2.12
        needs: guard
        uses: ./.github/workflows/_ci_pipeline.yml
        with:
            kind: pr
            workspace: /home/niubility2/cenzhiyao/ci/magi-compiler-workspaces/pr-${{ github.event.pull_request.number }}-pt212
            head-sha: ${{ github.event.pull_request.head.sha }}
            base-sha: ${{ github.event.pull_request.base.sha }}
            pr-number: ${{ github.event.pull_request.number }}
            base-image: nvcr.io/nvidia/pytorch:26.05-py3
            pytorch-label: pt212
        secrets: inherit

    gate:
        name: Integration Test
        needs: [pt29, pt212]
        if: always()
        runs-on: ubuntu-latest
        steps:
        -   run: |
                test "${{ needs.pt29.result }}" = "success"
                test "${{ needs.pt212.result }}" = "success"
