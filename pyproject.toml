[project]
name = "magi_compiler"
dynamic = ["version"]
description = "A plug-and-play compiler that delivers free-lunch optimizations for both inference and training."
authors = [
    {name = "Hongyu Jia", email = "jiahy@sand.ai"},
    {name = "Zhiyao Cen", email = "2523403608@qq.com"},
    {name = "Taoran Wang", email = "wangtaoran0504nb@outlook.com"},
    {name = "Yunbo Zhang", email = "mistbd@qq.com"},
]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.12"
# Runtime dependencies (mirror of requirements.txt).
# graphviz is a Python binding; the `dot` binary is a system dependency
# (sudo apt update && sudo apt install graphviz).
dependencies = [
    "depyf",
    "graphviz",
    "pydantic-settings",
    "seaborn",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/SandAI-org/MagiCompiler/"
"Bug Tracker" = "https://github.com/SandAI-org/MagiCompiler/issues"

[project.optional-dependencies]
# Test-only dependencies (mirror of requirements-test.txt).
# torch, triton, torchvision are intentionally NOT listed: they must be
# pre-installed (e.g. via NVIDIA NGC base image) because their versions
# are tightly coupled to each other and to the CUDA toolkit.
test = [
    "diffusers==0.32.2",
    "fairscale",
    # Pin filelock < 3.19: versions >= 3.19 call unlink() in _release() before
    # flock(LOCK_UN), which raises FileNotFoundError on Docker overlayfs/FUSE.
    # See: https://github.com/tox-dev/filelock/issues/494
    "filelock<3.19",
    "ninja",
    "pytest",
    "timm==1.0.15",
    "torchtitan==0.2.0",
    "transformers==4.48.3",
]

[tool.isort]
profile = "black"

[build-system]
requires = [
    "setuptools>=61.0",
    "wheel",
    "versioningit",
]
build-backend = "setuptools.build_meta"

[tool.versioningit]
vcs = "git"
default-version = "1.0.0"

[tool.versioningit.write]
file = "magi_compiler/_version.py"
encoding = "utf-8"
template = "__version__ = '{version}'"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["magi_compiler*"]
exclude = [
    "build*",
    "tests*",
    "dist*",
    "docs*",
    "tools*",
    "assets*",
]
